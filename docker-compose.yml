name: traffic-bigdata

services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: traffic-kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    networks: [traffic-net]

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: traffic-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic traffic.iot.raw --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic traffic.iot.processed --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic traffic.video.raw --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic traffic.video.processed --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic traffic.source.status --partitions 1 --replication-factor 1
        echo "IoT and video Kafka topics are ready"
    networks: [traffic-net]

  spark-processor:
    build:
      context: .
      dockerfile: services/spark_processor/Dockerfile
    container_name: traffic-spark
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPARK_CHECKPOINT_DIR: /tmp/spark-checkpoint/traffic-multisource-v2
      SPARK_LOG_LEVEL: WARN
    volumes:
      - spark-checkpoint:/tmp/spark-checkpoint
      - ivy-cache:/root/.ivy2
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [traffic-net]

  iot-producer:
    build:
      context: .
      dockerfile: services/iot_producer/Dockerfile
    container_name: traffic-iot
    ports:
      - "${IOT_SOURCE_PORT:-8101}:8101"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      IOT_SCENARIO: ${IOT_SCENARIO:-normal}
      IOT_INTERVAL_SECONDS: ${IOT_INTERVAL_SECONDS:-1}
      IOT_INCIDENT_DURATION_SECONDS: ${IOT_INCIDENT_DURATION_SECONDS:-30}
      IOT_RANDOM_SEED: ${IOT_RANDOM_SEED:-2026}
      IOT_DATA_FILE: /app/data/iot/scenario_config.json
      AI_RESULT_STALE_SECONDS: ${AI_RESULT_STALE_SECONDS:-12}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [traffic-net]

networks:
  traffic-net:
    driver: bridge

volumes:
  spark-checkpoint:
  ivy-cache:
